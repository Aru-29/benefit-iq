[project]
name = "benefit-iq"
version = "0.1.0"
description = "BenefitIQ Backend"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "clickhouse-connect>=0.10.0",
    "dependency-injector>=4.48.2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "redis>=7.0.0",
    "structlog>=25.4.0",
    "opentelemetry-api>=1.37.0",
    "opentelemetry-sdk>=1.37.0",
    "opentelemetry-exporter-otlp>=1.37.0",
    "opentelemetry-instrumentation-fastapi>=0.58b0",
    "opentelemetry-instrumentation-httpx>=0.58b0",
    "opentelemetry-instrumentation-redis>=0.58b0",
    "opentelemetry-instrumentation-confluent-kafka>=0.58b0",
    "uvicorn[standard]>=0.52.1",
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",
    "authlib>=1.3.1",
    "aiosmtplib>=3.0.1",
    "user-agents>=2.2.0",
    "slowapi>=0.1.9",
    "cryptography>=42.0.5",
    "confluent-kafka>=2.3.0",
    "email-validator>=2.1.1",
]

[project.optional-dependencies]
ml = ["xgboost>=3.0,<4", "numpy>=2,<3", "scikit-learn>=1.6,<2"]

[project.scripts]
benefit-iq = "benefit_iq.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "benefit_iq"
module-root = "src"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
    "pytest-httpx>=0.30.0",
    "coverage>=7.4.0",
]
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
# Preserve existing public enum/generic serialization conventions.
ignore = ["UP042", "UP046"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "dependency_injector.wiring.Provide"]
